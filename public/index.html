<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TEAM 84 FF — Free Fire Diamond & Bot Top-Up</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--orange:#FF5A1F;--charcoal:#14141C;--gold:#FFC107;--ember:#E4002B;--fog:#F8FAFC;--ink:#334155;--border:#E2E8F0;}
*{box-sizing:border-box;}
body{margin:0;font-family:'Poppins','Noto Sans Bengali',sans-serif;color:var(--ink);background:#F8FAFC;padding:0;}
a{text-decoration:none;color:inherit;}
.container{max-width:1180px;margin:0 auto;padding:0 20px;}
header.site{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--border);}
.header-in{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;max-width:1180px;margin:0 auto;}
.logo{font-weight:700;font-size:19px;color:var(--charcoal);cursor:pointer;}
.logo b{color:var(--orange);}
nav.main-nav{display:flex;align-items:center;gap:24px;}
nav.main-nav a{font-weight:500;font-size:14px;cursor:pointer;color:#334155;}
nav.main-nav a:hover, nav.main-nav a.active{color:var(--orange);font-weight:600;}
.nav-right{display:flex;align-items:center;gap:12px;}
.nav-avatar-btn{width:38px;height:38px;border-radius:50%;background:#8FA1B3;display:flex;align-items:center;justify-content:center;cursor:pointer;border:2px solid #E2E8F0;overflow:hidden;padding:0;}
.nav-avatar-btn svg{width:22px;height:22px;fill:#1A202C;}
.nav-avatar-btn img{width:100%;height:100%;object-fit:cover;}
.hamburger{display:none;background:none;border:none;font-size:22px;cursor:pointer;}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:600;font-size:14px;border:none;border-radius:6px;padding:10px 20px;cursor:pointer;font-family:inherit;}
.btn-primary{background:linear-gradient(90deg,var(--orange),var(--ember));color:#fff;}
.btn-secondary{background:#3A2418;color:#fff;}
.btn-sm{padding:6px 12px;font-size:12px;}

.home-title{text-align:center;font-weight:700;font-size:22px;color:var(--ember);margin:30px 0 24px;letter-spacing:0.5px;display:flex;align-items:center;justify-content:center;gap:16px;}
.home-title::before, .home-title::after{content:'';height:2px;background:#FDBA74;flex:1;max-width:180px;}

.cat-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;}
@media(max-width:1100px){.cat-grid{grid-template-columns:repeat(4,1fr);}}
@media(max-width:768px){.cat-grid{grid-template-columns:repeat(3,1fr);}}
@media(max-width:520px){.cat-grid{grid-template-columns:repeat(2,1fr);}}
.poster-card{background:#fff;border:1px solid var(--border);border-radius:10px;overflow:hidden;cursor:pointer;transition:transform .2s,box-shadow .2s;box-shadow:0 3px 8px rgba(0,0,0,0.04);display:flex;flex-direction:column;}
.poster-card:hover{transform:translateY(-3px);box-shadow:0 8px 18px rgba(0,0,0,0.1);}
.poster-thumb{width:100%;aspect-ratio:4/3;background:#1E293B;display:flex;align-items:center;justify-content:center;overflow:hidden;}
.poster-thumb img{width:100%;height:100%;object-fit:cover;}
.poster-foot{padding:8px;text-align:center;background:#fff;border-top:1px solid #F1F5F9;flex-grow:1;display:flex;align-items:center;justify-content:center;}
.poster-foot h3{margin:0;font-size:12px;font-weight:600;color:#1E293B;line-height:1.3;}

/* NOTICE BANNER */
.sub-notice{background:linear-gradient(90deg,#FF5A1F,#E4002B);border-radius:8px;padding:12px 16px;color:#fff;margin:20px 0 28px;position:relative;}
.sub-notice-tag{font-size:11px;font-weight:700;letter-spacing:1px;text-align:center;margin-bottom:6px;}
.sub-notice-box{background:#1E293B;border-radius:6px;padding:10px 14px;font-size:12px;text-align:center;line-height:1.5;}
.sub-two-grid{display:grid;grid-template-columns:repeat(2, 220px);gap:24px;justify-content:center;margin-bottom:40px;}
@media(max-width:560px){.sub-two-grid{grid-template-columns:repeat(2, 1fr);}}

/* OPTION SELECTION PAGE */
.product-banner-header{display:flex;align-items:center;gap:16px;margin:24px 0 20px;}
.product-banner-header img{width:64px;height:64px;border-radius:12px;object-fit:cover;box-shadow:0 4px 10px rgba(0,0,0,0.08);}
.product-banner-header h1{margin:0;font-size:20px;color:#1E293B;font-weight:700;}
.product-banner-header span{font-size:12.5px;color:#64748B;}
.topup-layout{display:grid;grid-template-columns:1.6fr 1fr;gap:20px;margin-bottom:50px;}
@media(max-width:850px){.topup-layout{grid-template-columns:1fr;}}
.card-panel{background:#fff;border:1px solid var(--border);border-radius:8px;padding:18px;}
.panel-step{font-size:13.5px;font-weight:700;color:#1E293B;margin-bottom:14px;display:flex;align-items:center;gap:6px;}
.panel-step b{background:#E4002B;color:#fff;width:18px;height:18px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:10px;}
.options-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
@media(max-width:900px){.options-grid{grid-template-columns:1fr 1fr;}}
@media(max-width:560px){.options-grid{grid-template-columns:1fr;}}
.opt-box{border:1.5px solid #CBD5E1;border-radius:6px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;background:#fff;transition:all 0.15s;}
.opt-box:hover{border-color:#FF5A1F;}
.opt-box.selected{background:linear-gradient(90deg,#FF5A1F,#E4002B);border-color:#E4002B;color:#fff;}
.opt-box .opt-left{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:500;}
.opt-box .opt-radio{width:12px;height:12px;border-radius:50%;border:1.5px solid #94A3B8;display:inline-block;}
.opt-box.selected .opt-radio{border-color:#fff;background:#fff;}
.opt-box .opt-price{font-size:13px;font-weight:700;}
.yt-link-btn{display:flex;align-items:center;justify-content:center;gap:6px;background:#F8FAFC;border:1px solid var(--border);border-radius:6px;padding:8px;font-size:12.5px;color:#2563EB;font-weight:600;margin-bottom:14px;cursor:pointer;}
.field-label{font-size:12px;font-weight:600;color:#475569;margin-bottom:4px;display:block;}
.p-input-box{width:100%;padding:9px 12px;border:1.5px solid #CBD5E1;border-radius:6px;font-size:13px;outline:none;}
.p-input-box:focus{border-color:#FF5A1F;}
.uid-check-btn{width:100%;margin-top:8px;background:linear-gradient(90deg,#FF5A1F,#E4002B);color:#fff;border:none;border-radius:6px;padding:8px;font-size:12.5px;font-weight:600;cursor:pointer;}
.summary-table{margin-top:10px;font-size:12.5px;color:#475569;line-height:2;}
.summary-table div{display:flex;justify-content:space-between;}
.summary-table div b{color:#1E293B;}
.direct-method-btn{width:100%;border:1.5px solid #FF5A1F;background:#fff;border-radius:6px;padding:8px;text-align:center;cursor:pointer;margin:14px 0 10px;}
.direct-method-btn b{display:block;font-size:13.5px;color:#1E293B;}
.direct-method-btn small{font-size:10px;color:#64748B;}
.purchase-btn{width:100%;background:linear-gradient(90deg,#FF5A1F,#E4002B);color:#fff;border:none;border-radius:6px;padding:11px;font-size:14px;font-weight:700;cursor:pointer;}

/* LAST ORDERS SECTION */
.last-orders-wrap{max-width:820px;margin:40px auto 30px;}
.last-orders-title{text-align:center;font-size:24px;font-weight:800;color:#E4002B;letter-spacing:1px;margin-bottom:20px;}
.orders-card-box{background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px 18px;box-shadow:0 4px 16px rgba(0,0,0,0.03);}
.order-row-item{display:flex;align-items:center;justify-content:space-between;padding:11px 8px;border-bottom:1px solid #F1F5F9;}
.order-row-item:last-child{border-bottom:none;}
.order-row-item.vip-row{background:#FFFDF0;border:1.5px solid #FDE047;border-radius:8px;padding:10px 14px;margin:6px 0;}
.order-row-left{display:flex;align-items:center;gap:12px;}
.order-user-avatar{width:38px;height:38px;border-radius:50%;background:#475569;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;overflow:hidden;flex-shrink:0;}
.order-user-avatar img{width:100%;height:100%;object-fit:cover;}
.order-user-info{font-size:12.5px;}
.order-name-row{display:flex;align-items:center;gap:6px;font-weight:700;color:#1E293B;}
.order-badge-tick{color:#22C55E;font-size:12px;}
.order-vip-badge{background:#EAB308;color:#fff;font-size:9.5px;font-weight:800;padding:1px 6px;border-radius:4px;letter-spacing:0.5px;}
.order-prod-desc{font-size:11.5px;color:#64748B;margin-top:2px;}
.order-status-pill{background:#16A34A;color:#fff;font-size:11px;font-weight:600;padding:3px 12px;border-radius:99px;display:inline-flex;align-items:center;gap:4px;}

/* FOLLOW US SECTION */
.follow-wrap{max-width:820px;margin:30px auto 60px;}
.follow-card-box{background:#fff;border:1px solid var(--border);border-radius:14px;padding:26px 24px;box-shadow:0 4px 18px rgba(0,0,0,0.03);}
.follow-title{text-align:center;font-size:24px;font-weight:800;color:#E4002B;letter-spacing:1px;margin-bottom:24px;}
.follow-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media(max-width:640px){.follow-grid{grid-template-columns:1fr;}}
.follow-item{background:#F8FAFC;border:1px solid #E2E8F0;border-radius:8px;padding:14px 18px;display:flex;align-items:center;gap:14px;cursor:pointer;transition:all 0.15s;}
.follow-item:hover{background:#F1F5F9;border-color:#CBD5E1;transform:translateY(-2px);}
.follow-icon{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.follow-text{font-size:13px;font-weight:600;color:#1E293B;}

/* CONFIRM PURCHASE */
.confirm-wrap{max-width:520px;margin:36px auto 60px;text-align:center;}
.confirm-title{font-size:26px;font-weight:800;color:#E4002B;margin-bottom:20px;letter-spacing:1px;}
.confirm-card{background:#fff;border:1px solid #CBD5E1;border-radius:6px;overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,0.05);text-align:left;}
.confirm-card-hdr{background:#F1F5F9;padding:10px 16px;font-size:13.5px;font-weight:700;color:#334155;border-bottom:1px solid #E2E8F0;text-align:center;}
.confirm-card-body{padding:14px 18px;font-size:13px;color:#334155;}
.confirm-row{display:flex;padding:7px 0;border-bottom:1px solid #F1F5F9;}
.confirm-row .c-label{width:140px;font-weight:600;}
.confirm-row .c-val{flex:1;}
.confirm-action-btn{width:100%;background:#FF5A1F;color:#fff;border:none;border-radius:6px;padding:10px;font-size:14px;font-weight:700;margin-top:16px;cursor:pointer;}

/* PAYMENT METHOD PAGE */
.pay-methods-wrap{max-width:520px;margin:40px auto 60px;text-align:center;}
.pay-methods-title{font-size:26px;font-weight:800;color:#E4002B;margin-bottom:26px;}
.pay-logos-grid{display:flex;justify-content:center;gap:18px;}
.pay-method-card{width:150px;border:1.5px solid #CBD5E1;border-radius:8px;overflow:hidden;background:#fff;cursor:pointer;transition:transform 0.2s;}
.pay-method-card:hover{transform:translateY(-3px);border-color:#FF5A1F;}
.pay-method-card .top-img{height:70px;display:flex;align-items:center;justify-content:center;padding:10px;}
.pay-method-card .bottom-bar{color:#fff;padding:8px 6px;text-align:center;}
.pay-method-card .bottom-bar b{display:block;font-size:12px;}
.pay-method-card .bottom-bar small{font-size:9.5px;opacity:0.9;}

/* GATEWAY PAGE */
.gateway-wrap{max-width:440px;margin:30px auto 60px;background:#fff;border:1px solid #CBD5E1;border-radius:12px;overflow:hidden;box-shadow:0 10px 28px rgba(0,0,0,0.06);padding:20px;}
.gateway-logo-hdr{text-align:center;padding:10px 0 16px;}
.gateway-invoice-box{display:flex;justify-content:space-between;align-items:center;border:1px solid #E2E8F0;border-radius:8px;padding:10px 14px;background:#fff;margin-bottom:16px;}
.gateway-invoice-left{display:flex;align-items:center;gap:10px;}
.gateway-invoice-text{font-size:11px;color:#475569;line-height:1.3;}
.gateway-invoice-text b{display:block;color:#1E293B;font-size:12.5px;}
.gateway-price{font-size:20px;font-weight:700;color:#1E293B;}
.gateway-red-box{background:#E4002B;border-radius:8px;padding:16px;color:#fff;}
.gateway-red-box.bkash-bg{background:#E2136E;}
.gateway-red-title{text-align:center;font-size:14.5px;font-weight:700;margin-bottom:12px;}
.gateway-trx-input{width:100%;padding:10px 14px;border-radius:6px;border:none;outline:none;font-size:14px;margin-bottom:12px;color:#1E293B;}
.gateway-rules{font-size:11px;line-height:1.7;margin-bottom:14px;}
.gateway-rules div{margin-bottom:4px;display:flex;align-items:flex-start;gap:6px;}
.gateway-copy-badge{display:inline-flex;align-items:center;gap:4px;background:rgba(255,255,255,0.2);padding:2px 6px;border-radius:4px;cursor:pointer;font-weight:700;}
.gateway-verify-btn{width:100%;background:#B91C1C;color:#fff;border:none;border-radius:6px;padding:12px;font-size:15px;font-weight:800;letter-spacing:1px;cursor:pointer;margin-top:14px;}

/* AUTH UI */
.auth-bg{min-height:calc(100vh - 140px);background:radial-gradient(circle at 50% 20%, #e8f3fc 0%, #c4e2fb 50%, #a0d0f8 100%);display:flex;align-items:center;justify-content:center;padding:40px 16px;position:relative;}
.modern-auth-card{width:100%;max-width:390px;background:rgba(255,255,255,0.96);backdrop-filter:blur(12px);border-radius:24px;padding:32px 24px;box-shadow:0 15px 35px rgba(0,0,0,0.08);border:1px solid rgba(255,255,255,0.8);text-align:center;}
.auth-top-badge{width:46px;height:46px;background:#fff;border:1px solid #edf2f7;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;margin-bottom:12px;box-shadow:0 4px 10px rgba(0,0,0,0.04);font-size:18px;font-weight:bold;}
.auth-title{font-size:24px;font-weight:700;margin:0 0 6px;color:#FF5A1F;}
.auth-subtitle{font-size:12px;color:#718096;margin:0 0 18px;}
.btn-google{width:100%;background:#fff;border:1.5px solid #FF6B4A;color:#2D3748;font-weight:600;font-size:13.5px;padding:9px 14px;border-radius:10px;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;}
.btn-google:hover{background:#FFF7F4;}
.divider-or{display:flex;align-items:center;text-align:center;margin:16px 0;color:#EA580C;font-size:12px;font-weight:700;}
.divider-or::before, .divider-or::after{content:'';flex:1;border-bottom:1.5px solid #FDBA74;}
.divider-or:not(:empty)::before{margin-right:12px;}
.divider-or:not(:empty)::after{margin-left:12px;}
.auth-form{display:flex;flex-direction:column;gap:12px;text-align:left;}
.auth-group{display:flex;flex-direction:column;gap:4px;}
.auth-group label{font-size:12px;font-weight:600;color:#2D3748;}
.auth-input-box{position:relative;display:flex;align-items:center;}
.auth-input{width:100%;padding:10px 12px;font-size:13.5px;border:1.5px solid #B0C4DE;border-radius:8px;outline:none;background:#fff;font-family:inherit;}
.auth-input:focus{border-color:#FF5A1F;}
.toggle-pwd{position:absolute;right:10px;background:none;border:none;cursor:pointer;color:#718096;font-size:13px;font-weight:600;}
.cf-badge{background:#F9FAFB;border:1px solid #E5E7EB;border-radius:8px;padding:8px 12px;display:flex;align-items:center;justify-content:space-between;margin:4px 0;}
.cf-left{display:flex;align-items:center;gap:8px;font-size:12px;color:#374151;font-weight:500;}
.cf-spin{width:14px;height:14px;border:2px solid #22c55e;border-top-color:transparent;border-radius:50%;animation:spin 0.8s linear infinite;}
@keyframes spin{100%{transform:rotate(360deg);}}
.cf-right{text-align:right;font-size:9px;color:#6B7280;line-height:1.2;}
.cf-right b{display:block;color:#374151;font-size:10px;}
.auth-action-btn{width:100%;background:linear-gradient(90deg,#FF5414,#E5003B);color:#fff;border:none;border-radius:10px;padding:12px;font-size:14px;font-weight:600;cursor:pointer;margin-top:6px;}
.auth-extra{margin-top:14px;font-size:12px;color:#64748B;text-align:center;}
.auth-extra a{color:#2563EB;font-weight:600;cursor:pointer;}

/* USER PROFILE DASHBOARD STYLES */
.profile-wrap{max-width:980px;margin:30px auto;padding:0 16px;}
.profile-head{display:flex;flex-direction:column;align-items:center;justify-content:center;margin-bottom:24px;}
.avatar-ring{width:86px;height:86px;border-radius:50%;padding:4px;background:linear-gradient(135deg, #FF5A1F, #E4002B);display:flex;align-items:center;justify-content:center;}
.avatar-inner{width:100%;height:100%;border-radius:50%;background:#8FA1B3;display:flex;align-items:center;justify-content:center;overflow:hidden;}
.avatar-inner svg{width:50px;height:50px;fill:#1A202C;}
.avatar-inner img{width:100%;height:100%;object-fit:cover;}
.badge-unverified{margin-top:8px;background:#6B7280;color:#fff;font-size:10px;font-weight:600;padding:2px 8px;border-radius:99px;}
.verify-link{font-size:11px;color:#2563EB;margin-top:4px;cursor:pointer;}
.yt-guide{font-size:11.5px;color:#E4002B;margin-top:4px;text-decoration:none;font-weight:500;}
.profile-user-name{font-size:24px;font-weight:700;color:#FF5A1F;margin:8px 0 0;}
.profile-stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:24px 0;}
@media(max-width:640px){.profile-stats-row{grid-template-columns:1fr;}}
.stat-card{border:1.5px solid #FF5A1F;border-radius:8px;background:#fff;padding:18px;text-align:center;}
.stat-title{font-size:17px;font-weight:600;color:#FF5A1F;margin-bottom:4px;}
.stat-val{font-size:20px;font-weight:700;color:#E4002B;}
.info-box{border:1px solid var(--border);border-radius:8px;background:#fff;margin-bottom:24px;overflow:hidden;}
.info-box-hdr{background:#F9FAFB;padding:12px 16px;font-weight:600;font-size:14px;color:#1F2937;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:6px;}
.info-box-body{padding:16px;font-size:13.5px;line-height:1.8;color:#374151;}
.profile-forms-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
@media(max-width:768px){.profile-forms-grid{grid-template-columns:1fr;}}
.p-form-card{border:1px solid var(--border);border-radius:8px;background:#fff;padding:22px;}
.p-form-title{text-align:center;font-size:18px;font-weight:700;color:#E4002B;margin-bottom:18px;}
.p-form-group{margin-bottom:12px;}
.p-form-group label{display:block;font-size:12.5px;font-weight:600;color:#374151;margin-bottom:4px;}
.p-input{width:100%;padding:9px 12px;border:1.5px solid #CBD5E1;border-radius:6px;font-size:13.5px;outline:none;}
.p-input:focus{border-color:#FF5A1F;}
.p-btn{background:linear-gradient(90deg, #FF5A1F, #E4002B);color:#fff;border:none;border-radius:6px;padding:9px 22px;font-weight:600;font-size:13.5px;cursor:pointer;margin-top:8px;}

/* ADMIN PANEL STYLES */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;}
.tab{border:1px solid var(--border);background:#fff;border-radius:6px;padding:8px 16px;font:600 13px Poppins,sans-serif;text-transform:capitalize;cursor:pointer;color:var(--ink);}
.tab.on{background:var(--charcoal);color:#fff;border-color:var(--charcoal);}
table.data{width:100%;border-collapse:collapse;font-size:12.5px;background:#fff;}
table.data th{background:#F1F5F9;text-align:left;padding:8px;white-space:nowrap;}
table.data td{padding:8px;border-bottom:1px solid var(--border);vertical-align:middle;}
table.data input.field{margin:0;padding:6px 8px;font-size:12.5px;min-width:70px;}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600;background:#FFF4EE;color:var(--orange);}
.pill.completed{background:#E8F7EE;color:#1a8a4a;}.pill.paid{background:#EAF2FF;color:var(--fb);}.pill.rejected{background:#FDECEF;color:var(--ember);}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px;}
.kpi{border:1px solid var(--border);border-radius:6px;padding:14px;background:#fff;}.kpi b{display:block;font-size:22px;color:var(--charcoal);}.kpi span{font-size:12px;color:#8a8b95;}
input.field{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px;outline:none;}

footer.site{background:#14141C;border-top:1px solid #2D3748;color:#94A3B8;padding:28px 20px;margin-top:50px;font-size:13px;}
.footer-in{max-width:1180px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:20px;}

function jget(s,k){ try{ return JSON.parse(s.getItem(k)); }catch(e){ return null; } }
function jset(s,k,v){ try{ s.setItem(k, JSON.stringify(v)); }catch(e){} }
function getUser(){ return jget(localStorage, 't84_user'); }
function tok(){ return jget(localStorage, 't84_token'); }
function setSession(t,u){ jset(localStorage,'t84_token',t); jset(localStorage,'t84_user',u); }
function clearSession(){ try{ localStorage.removeItem('t84_token'); localStorage.removeItem('t84_user'); }catch(e){} }

async function api(path, opt){
 opt=opt||{}; var h={'Content-Type':'application/json'}, t=tok(); if(t) h.Authorization='Bearer '+t;
 var r; try{ r=await fetch('/api'+path, {method:opt.method||'GET', headers:h, body:opt.body?JSON.stringify(opt.body):undefined}); }
 catch(e){ throw new Error('Cannot reach the server.'); }
 var j=await r.json().catch(function(){ return {}; });
 if(r.status===401 && t){ clearSession(); updateAuthArea(); }
 if(!r.ok) throw new Error(j.error||'Something went wrong'); return j;
}

function toast(m){ var t=document.createElement('div'); t.className='toast'; t.textContent=m; document.body.appendChild(t); setTimeout(function(){ t.remove(); }, 3000); }
function err(m){ return '<div class="container" style="padding:40px 0;"><p style="color:#E4002B;font-weight:600;">' + esc(m) + '</p></div>'; }

function updateAuthArea(){

async function submitAuth(e, type){
 e.preventDefault();
 var f=e.target, d=Object.fromEntries(new FormData(f)), b=$('#authBtn');
 if(type==='register' && d.password !== d.confirm){ toast('Passwords do not match'); return false; }
 if(b) b.disabled=true;
 try{
  var r=await api('/'+type, {method:'POST', body:d});
  setSession(r.token, r.user);
  toast(type==='login' ? 'Logged in' : 'Account created');
  updateAuthArea();
  go(r.user.role==='admin' ? '/admin' : '/');
 }catch(x){
  toast(x.message);
  if(b) b.disabled=false;
 }
 return false;
}

function choosePkg(id, price, label){
 if(!selPkg) selPkg = {};
 selPkg.id = id;
 selPkg.price = price;
 selPkg.label = label;
 route(1);
}

function chgQty(delta){
 selectedQty = Math.max(1, selectedQty + delta);
 $('#qtyVal').textContent = selectedQty;
 var total = (selPkg ? selPkg.price : 0) * selectedQty;
 $('#summaryTotal').textContent = '৳' + total;
}

function goToConfirm(){
 var uidVal = '';
 var waVal = '';

 if(currentProductType === 'guild'){
  waVal = $('#guildWaInput') ? $('#guildWaInput').value.trim() : '';
  uidVal = $('#guildUidInput') ? $('#guildUidInput').value.trim() : '';
  if(!waVal) return toast('দয়া করে হোয়াটসঅ্যাপ নাম্বার দিন');
  if(!uidVal) return toast('দয়া করে গিল্ডের Uid দিন');
 } else {
  uidVal = $('#playerUidInput') ? $('#playerUidInput').value.trim() : '';
  if(!uidVal) return toast('Please enter Player UID');
 }

 if(!selPkg) return toast('Please select an option');
 
 orderPayload = { 
  pkg: selPkg, 
  qty: selectedQty, 
  total: selPkg.price * selectedQty, 
  uid: uidVal,
  wa: waVal,
  isGuild: (currentProductType === 'guild')
 };
 go('/confirm-purchase');
}

async function updateProfile(e){
 e.preventDefault();
 var f=e.target, name=f.name.value, email=f.email.value, phone=f.phone.value;
 var fileInput = document.getElementById('avatarFileInput');
 var currentAvatar = getUser().avatar || '';

 function sendReq(av){
  api('/user/profile', {method:'PUT', body:{name:name, email:email, phone:phone, avatar:av}}).then(function(r){
   setSession(tok(), r.user);
   toast('Profile updated successfully!');
   updateAuthArea();
   route(1);
  }).catch(function(err){ toast(err.message); });
 }

 if(fileInput && fileInput.files && fileInput.files[0]){
  var file = fileInput.files[0];
  if(file.size > 3 * 1024 * 1024){ toast('Image file under 3MB required'); return false; }
  var reader = new FileReader();
  reader.onload = function(evt){ sendReq(evt.target.result); };
  reader.readAsDataURL(file);
 } else {
  sendReq(currentAvatar);
 }
 return false;
}

async function updatePassword(e){
 e.preventDefault();
 var f=e.target, oldPw=f.oldPassword.value, newPw=f.newPassword.value, conf=f.confirmPassword.value;
 if(newPw !== conf){ toast('New passwords do not match'); return false; }
 try{
  await api('/user/password', {method:'PUT', body:{oldPassword:oldPw, newPassword:newPw}});
  toast('Password changed successfully!');
  f.reset();
 }catch(err){ toast(err.message); }
 return false;
}

async function savePkg(id){

// ROUTER
async function route(keep){
 var my=++rtok, h=location.hash.replace('#','')||'/';
 updateAuthArea();
 var html;
 try{
  if(h==='/') html = renderHome();
  else if(h==='/topup') html = renderCategoryBoxesOnly();
  else if(h==='/contact') html = renderFollowUsSection();
  else if(h==='/category/like-guild-bot') html = renderSubCategories('like-guild-bot');
  else if(h==='/category/weekly-monthly') html = renderWeeklyMonthlySub();
  else if(h==='/category/indonesia-topup') html = renderIndonesiaSub();
  else if(h.indexOf('/package-select/')===0) html = renderPackageSelect(h.split('/')[2]);
  else if(h==='/confirm-purchase') html = renderConfirmPurchase();
  else if(h==='/payment-methods') html = renderPaymentMethods();
  else if(h.indexOf('/gateway/')===0) html = renderGateway(h.split('/')[2]);
  else if(h==='/account') html = await renderAccount();
  else if(h.indexOf('/admin')===0) html = await renderAdmin();
  else if(h==='/login') html = renderLogin();
  else if(h==='/register') html = renderRegister();
  else html = renderHome();
 }catch(e){ html = err(e.message); }
 if(my!==rtok) return;
 var y=window.scrollY;
 $('#app').innerHTML = html;
 window.scrollTo(0, keep===1?y:0);
}

window.addEventListener('hashchange', function(){ route(); });
